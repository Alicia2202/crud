# configuracion

spring.datasource.url=jdbc:h2:mem:testdb 
#conecta a una base de datos en memoria, no guarda los datos cuando se apaga el servidor
spring.h2.console.enabled=true 
#muestra la consola de la base de datos en memoria
spring.jpa.show-sql=true 
#muestra las consultas SQL que se ejecutan en la base de datos en memoria