spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/crud_db
spring.datasource.username=crud_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#para que la tabla se cree automaticamente en la base de datos al arrancar el servidor.

jwt.secret=${JWT_SECRET}
jwt.expiracion-minutos=60